# Installed by deploy/setup.sh as /etc/ssh/sshd_config.d/00-lightcycles-hardening.conf.
# sshd uses the first value it reads, so this file wins over later ones.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
